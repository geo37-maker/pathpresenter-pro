name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake build-essential
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv
      - name: Build
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Error context
        if: failure()
        run: |
          n=$(grep -n -m1 "Command failed" build.log | cut -d: -f1)
          echo "line: $n"
          start=$((n>45 ? n-45 : 1))
          sed -n "${start},$((n+2))p" build.log | cut -c1-220
          echo "=== error lines ==="
          grep -n -i -E "error:|fatal error|No such file|undefined reference|not found" build.log | tail -n 15 | cut -c1-220
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PathPresenterPro-apk
          path: |
            bin/*.apk
            build.log
