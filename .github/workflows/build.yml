name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Prepare main.py
      run: |
        if [ ! -f main.py ] && [ -f app.py ]; then cp app.py main.py; fi

    - name: Configure Buildozer
      run: |
        [ -f buildozer.spec ] || buildozer init
        sed -i 's/^title = .*/title = PathPresenterDownloader/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = pathpresenter/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.pathpresenter/' buildozer.spec
        sed -i 's/^requirements = .*/requirements = python3,kivy,requests,pillow/' buildozer.spec
        sed -i 's/^#\? *android.api = .*/android.api = 33/' buildozer.spec
        sed -i 's/^#\? *android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
        grep -E "^(title|package|requirements|android.api|android.accept)" buildozer.spec

    - name: Pre-accept Android licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build APK
      run: buildozer -v android debug

    - uses: actions/upload-artifact@v4
      with:
        name: PathPresenter-Android-App
        path: bin/*.apk
