      - name: Build
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Last lines of log
        if: failure()
        run: tail -n 80 build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PathPresenterPro-apk
          path: |
            bin/*.apk
            build.log
