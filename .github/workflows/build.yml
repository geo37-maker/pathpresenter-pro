name: Build Executable App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Application
      run: |
        pyinstaller --onefile --noconsole --name="PathPresenterDownloader" app.py

    - name: Upload Application Package
      uses: actions/upload-artifact@v3
      with:
        name: PathPresenterDownloader-App
        path: dist/PathPresenterDownloader*
        
