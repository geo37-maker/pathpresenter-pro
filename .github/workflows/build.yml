name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Prepare main.py
      run: |
        if [ ! -f main.py ] && [ -f app.py ]; then cp app.py main.py; fi
        ls -la

    - name: Build APK
      run: buildozer -v android debug

    - uses: actions/upload-artifact@v4
      with:
        name: PathPresenter-Android-App
        path: bin/*.apk
