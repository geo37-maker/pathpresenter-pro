name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Initialize Buildozer Config
      run: |
        # إنشاء ملف الإعدادات الخاص بـ Buildozer إذا لم يكن موجوداً
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        # تعديل الاسم والوضعية تلقائياً في الإعدادات
        sed -i 's/#title = My Application/title = PathPresenterDownloader/' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = pathpresenter/' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.pathpresenter/' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,requests,pillow,kivy/' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PathPresenter-Android-App
        path: bin/*.apk
        
