name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 libffi-dev libssl-dev cmake
        pip install --upgrade pip
        pip install buildozer==1.5.0 cython==0.29.36

    - name: Prepare main.py
      run: |
        if [ ! -f main.py ] && [ -f app.py ]; then cp app.py main.py; fi
        if [ ! -f main.py ]; then echo "ERREUR: main.py ou app.py introuvable a la racine"; ls -la; exit 1; fi

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = PathPresenterDownloader
        package.name = pathpresenter
        package.domain = org.pathpresenter
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json,txt
        version = 0.1
        requirements = python3,kivy,requests,urllib3,certifi,idna,charset-normalizer
        orientation = portrait
        fullscreen = 0
        android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.allow_backup = True

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF
        cat buildozer.spec

    - name: Build APK
      run: buildozer -v android debug

    - uses: actions/upload-artifact@v4
      with:
        name: PathPresenter-Android-App
        path: bin/*.apk
